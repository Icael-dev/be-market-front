    <!-- Anti-flash: apply theme before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta name="keywords" content="electronique, smartphone, ordinateur, accessoires, togo, lome, tmoney, flooz" />
    <meta name="author" content="BE-Market" />

    <!-- Open Graph -->
    <meta property="og:title" content="BE-Market - Accessoires Electroniques au Togo" />
    <meta property="og:description" content="Decouvrez les meilleurs accessoires electroniques: smartphones, ordinateurs, ecouteurs, montres connectees..." />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BE-Market - Accessoires Electroniques" />
